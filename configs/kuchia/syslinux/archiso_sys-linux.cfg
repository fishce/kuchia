LABEL kuchia
TEXT HELP
Boot the Kuchia install medium on BIOS.
It allows you to install Kuchia or perform system maintenance.
ENDTEXT
MENU LABEL Kuchia install medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

# Accessibility boot option
LABEL kuchiaspeech
TEXT HELP
Boot the Kuchia install medium on BIOS with speakup screen reader.
It allows you to install Kuchia or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL Kuchia install medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
